<style>
/* base reset (standalone hosting) */
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: Egyptian street-food stall — skewed ribbon labels and diamond strips from the printed menu, one long menu column with a floating cart bar; owner dashboard as a second view. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f7f1; --ink:#1c2a1f; --muted:#64705f; --line:#e6ebe2;
  --green:#1a8a3c; --green-ink:#ffffff; --orange:#f05a1a; --orange-ink:#ffffff; --brown:#0f6a2c; --brown-ink:#ffffff;
  --ok:#1a8a3c; --warn:#c77700; --bad:#d0301f; --info:#1f63b5;
  --shadow:0 12px 30px -14px rgba(26,90,40,.28);
  --f-display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-inline-end:auto;min-width:0}
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--orange)}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:400;line-height:1;color:var(--green)}
.brand small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.pill:hover{border-color:var(--green)}
.pill.on{background:var(--brown);color:var(--brown-ink);border-color:var(--brown)}
.views{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.views button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.views button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--green)}
.views .dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:var(--orange-ink);font-size:11px;line-height:18px;text-align:center;padding:0 5px;margin-inline-start:4px}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(60% 80% at 15% 40%,color-mix(in srgb,var(--orange) 9%,transparent),transparent 70%),radial-gradient(50% 70% at 95% 10%,color-mix(in srgb,var(--green) 8%,transparent),transparent 70%),var(--bg)}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:24px;padding-block:36px 28px}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:600}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,9vw,104px);line-height:.95;color:var(--green);text-shadow:0 4px 0 color-mix(in srgb,var(--brown) 30%,transparent);margin-top:6px}
.hero h1 span{display:inline-block;animation:rise .8s cubic-bezier(.2,.9,.3,1.3) both}
.hero h1 span:nth-child(2){animation-delay:.12s;color:var(--orange)}
.hero .tag{font-family:var(--f-display);font-size:clamp(22px,3vw,30px);color:var(--orange);margin:8px 0 0}
.diamonds{display:flex;gap:6px;margin:14px 0 18px}
.diamonds i{width:10px;height:10px;transform:rotate(45deg);background:var(--orange);animation:blink 2.4s ease-in-out infinite}
.diamonds i:nth-child(3n){background:var(--green)}.diamonds i:nth-child(4n){background:var(--line)}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .15s ease, filter .15s}
.btn:active{transform:scale(.97)}
.btn-green{background:var(--green);color:var(--green-ink)}
.btn-orange{background:var(--orange);color:var(--orange-ink)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hotline{display:flex;align-items:baseline;gap:10px}
.hotline b{font-family:var(--f-display);font-weight:400;font-size:40px;color:var(--green);line-height:1;letter-spacing:.02em}
.hotline small{color:var(--muted);font-size:13px}
.hero-art{position:relative;aspect-ratio:1.45;max-width:100%}
.hero-art .plate{position:absolute;inset:8% 4% 2%;border-radius:50%;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--orange) 26%,transparent),transparent 68%)}
.hero-art img{position:relative;width:100%;height:100%;object-fit:contain;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 26px 22px rgba(60,30,10,.28));mix-blend-mode:multiply;border-radius:20px}
:root[data-theme="dark"] .hero-art img{mix-blend-mode:normal}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero-art img{mix-blend-mode:normal}}
.ribbon{position:absolute;font-family:var(--f-display);font-size:20px;padding:4px 16px 2px;transform:skewX(-8deg) rotate(-4deg);box-shadow:0 5px 0 rgba(0,0,0,.18);white-space:nowrap}
.ribbon.g{background:var(--green);color:var(--green-ink)}.ribbon.o{background:var(--orange);color:var(--orange-ink)}
.hero-art .r1{top:4%;right:4%;animation:sway 4s ease-in-out infinite}
.hero-art .r2{bottom:6%;left:2%;transform:skewX(-8deg) rotate(5deg);animation:sway 4.6s ease-in-out infinite reverse}
.closed-note{margin-top:14px;display:inline-block;background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad);border-radius:12px;padding:8px 14px;font-weight:500;font-size:14px}

/* category bar */
.catbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.catbar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.search{flex:0 0 220px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding-block:9px;padding-inline:36px 12px}
.search svg{position:absolute;inset-inline-start:11px;top:50%;translate:0 -50%;color:var(--muted)}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;transition:background .2s,color .2s}
.chip.on{background:var(--green);color:var(--green-ink);border-color:var(--green)}

/* menu */
main{padding-block:20px 140px}
.cat{scroll-margin-top:140px;margin-bottom:34px}
.cat-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:12px}
.cat-head .pic{width:96px;height:80px;flex:none;border-radius:18px;background:var(--surface);overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
.cat-head .pic img{width:100%;height:100%;object-fit:cover}
.cat:hover .cat-head .pic{transform:rotate(-5deg) scale(1.06)}
.cat-head .pic.drinks{background:linear-gradient(160deg,var(--orange),var(--green));color:#fff;font-family:var(--f-display);font-size:28px}
.cat-head h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;padding:6px 18px 2px;transform:skewX(-8deg);box-shadow:0 5px 0 color-mix(in srgb,var(--brown) 45%,transparent)}
.cat-head h2 span{display:inline-block;transform:skewX(8deg)}
.cat:nth-child(odd) .cat-head h2{background:var(--green);color:var(--green-ink)}
.cat:nth-child(even) .cat-head h2{background:var(--orange);color:var(--orange-ink)}
.cat-head small{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding-bottom:4px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px -6px rgba(26,90,40,.18);border-radius:var(--r);padding:12px 14px;min-width:0;transition:border-color .2s,transform .2s}
.item:hover{border-color:color-mix(in srgb,var(--green) 50%,var(--line))}
.item.in{border-color:var(--green);background:color-mix(in srgb,var(--green) 6%,var(--surface))}
.item .body{flex:1;min-width:0}
.item .name{font-weight:600;font-size:15.5px;line-height:1.35}
.variants{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.variants button{border:1px dashed color-mix(in srgb,var(--muted) 60%,transparent);background:transparent;border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted)}
.variants button[aria-pressed="true"]{border:1px solid var(--brown);background:var(--brown);color:var(--brown-ink)}
.price{font-family:var(--f-display);font-size:22px;color:var(--green);white-space:nowrap;line-height:1}
.price small{font-family:var(--f-body);font-size:11px;color:var(--muted);margin-inline-start:2px}
.add{width:40px;height:40px;border-radius:12px;border:0;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;flex:none;transition:transform .15s}
.add:active{transform:scale(.88)}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:12px;padding:3px;flex:none}
.stepper button{width:32px;height:32px;border:0;border-radius:9px;background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.stepper span{min-width:24px;text-align:center;font-weight:600}
.note{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
.empty-search{text-align:center;color:var(--muted);padding:40px 0}

/* branches */
.branches{margin-top:20px}
.branches h2{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--green);margin-bottom:12px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bcard b{display:inline-block;background:var(--brown);color:var(--brown-ink);border-radius:8px;padding:1px 10px;font-weight:500;font-size:13px}
.bcard p{margin:6px 0 0;color:var(--muted);font-size:13.5px}

/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.cartbar.hide{transform:translateY(130%)}
.cartbar button{pointer-events:auto;margin-inline:auto;max-width:560px;width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--green);color:var(--green-ink);padding:12px 16px;box-shadow:0 16px 36px -12px rgba(20,60,30,.55);font-weight:600}
.cartbar .count{background:var(--green-ink);color:var(--green);border-radius:10px;min-width:30px;height:30px;display:grid;place-items:center;font-weight:700}
.cartbar .total{margin-inline-start:auto;font-family:var(--f-display);font-weight:400;font-size:22px}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
.flyer{position:fixed;z-index:80;width:18px;height:18px;border-radius:50%;background:var(--orange);pointer-events:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 30%,transparent)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,40,20,.35);z-index:70;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.drawer{position:fixed;z-index:71;background:var(--bg);display:flex;flex-direction:column;
  inset:auto 0 0 0;max-height:92%;border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.show{transform:none}
@media (min-width:820px){.drawer{inset:0 auto 0 0;width:440px;max-height:none;border-radius:0 22px 22px 0;transform:translateX(-100%);padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}}
.dhead{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.dhead h3{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--green);margin-inline-end:auto}
.x{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.dbody{overflow-y:auto;padding:14px 18px;flex:1}
.dfoot{padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--surface)}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .nm{flex:1;min-width:0;font-weight:500}
.line .nm small{display:block;color:var(--muted);font-weight:400}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.sumrow b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--green)}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--orange)}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
label.f input,label.f textarea,label.f select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
label.f textarea{resize:vertical;min-height:64px}
.err{color:var(--bad);font-size:12.5px;margin-top:3px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pay label{position:relative;display:block;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 12px;cursor:pointer;transition:border-color .2s,transform .2s}
.pay input{position:absolute;opacity:0}
.pay label:has(input:checked){border-color:var(--green);background:color-mix(in srgb,var(--green) 8%,var(--surface));transform:translateY(-2px)}
.pay label:has(input:focus-visible){outline:3px solid var(--orange);outline-offset:2px}
.pay .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:8px}
.pay .cash .ic{background:var(--green);color:var(--green-ink)}
.pay .insta .ic{background:var(--orange);color:var(--orange-ink)}
.pay b{display:block;font-size:14.5px}
.pay small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.info{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.done{text-align:center;padding:10px 0}
.done .seal{width:88px;height:88px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;margin:8px auto 14px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.done h4{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;color:var(--green)}
.code{font-family:var(--f-display);font-size:34px;color:var(--orange);letter-spacing:.06em}

/* tracker */
.track{display:flex;gap:4px;margin:10px 0 2px}
.track div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.track div::before{content:"";display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:4px}
.track div.on{color:var(--ink);font-weight:500}
.track div.on::before{background:var(--green)}
.track div.now::before{background:var(--orange);animation:pulse 1.4s ease-in-out infinite}
.myorder{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.myorder header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* status badges */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-new{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.st-preparing{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.st-onway{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.st-done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st-cancelled{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.paytag{border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600}
.paytag.cash{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.paytag.instapay{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange)}

/* owner */
#owner{padding-block:20px 60px}
.o-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.o-head h1{font-family:var(--f-display);font-weight:400;font-size:36px;color:var(--green);margin-inline-end:auto}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{color:var(--muted);font-size:12.5px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.2}
.stat.hot b{color:var(--orange)}
.o-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--brown);color:var(--brown-ink);border-color:var(--brown)}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;border-inline-start:5px solid var(--line)}
.ocard.s-new{border-inline-start-color:var(--orange);animation:glow 2s ease-in-out 3}
.ocard.s-preparing{border-inline-start-color:var(--warn)}
.ocard.s-onway{border-inline-start-color:var(--info)}
.ocard.s-done{border-inline-start-color:var(--ok)}
.ocard.s-cancelled{opacity:.7}
.ocard .row1{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ocard .ono{font-family:var(--f-display);font-size:24px;color:var(--orange);line-height:1}
.ocard .ago{color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.cust{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 16px;margin:10px 0;font-size:14px}
.cust div{min-width:0;overflow-wrap:anywhere}
.cust small{color:var(--muted);display:block;font-size:11.5px}
.olines{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:14px}
.olines div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.olines .tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.oacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.oacts .btn{padding:8px 14px;font-size:14px;border-radius:12px}
.btn-bad{background:transparent;border:1px solid color-mix(in srgb,var(--bad) 50%,var(--line));color:var(--bad)}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel h3{font-size:15px;margin-bottom:8px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{appearance:none;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{inset-inline-start:23px}
.o-empty{text-align:center;padding:50px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.o-empty b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:4px}

/* toasts */
.toasts{position:fixed;z-index:90;top:calc(env(safe-area-inset-top,0px) + 74px);inset-inline-end:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--green);color:var(--brown-ink);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);animation:slidein .4s cubic-bezier(.2,.9,.3,1.3);font-size:14px}
.toast b{display:block;font-size:15px}
.toast.new{background:var(--orange);color:var(--orange-ink)}

@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
@keyframes bob{50%{transform:translateY(-12px) rotate(-1.5deg)}}
@keyframes sway{50%{translate:0 -6px}}
@keyframes blink{50%{opacity:.35}}
@keyframes bump{40%{transform:scale(1.06)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr;padding-block:20px 18px}
  .hero-art{order:-1;max-width:520px;width:100%;margin-inline:auto}
  .items{grid-template-columns:1fr}
  .search{flex-basis:130px}
  .o-grid{grid-template-columns:1fr}
  .side{position:static;order:-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand small{display:none}
}
@media (max-width:480px){
  .views button{padding:6px 9px;font-size:12px}
  .brand b{font-size:19px}
  .cat-head .pic{width:76px;height:64px}
  .cat-head h2{font-size:25px}
  .pay{grid-template-columns:1fr}
}

/* order type */
.otype label{padding:12px}
.otype .ic{background:var(--surface-2);color:var(--green)}
.otype label:has(input:checked) .ic{background:var(--green);color:var(--green-ink)}
.typetag{border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.typetag.pickup{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
/* language + login */
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.lang:hover{border-color:var(--orange)}
html[dir="ltr"] .hero h1{font-size:clamp(46px,7.5vw,92px)}
html[dir="ltr"] .cat-head h2,html[dir="ltr"] .ribbon{transform:skewX(8deg)}
html[dir="ltr"] .cat-head h2 span{transform:skewX(-8deg)}
html[dir="ltr"] .hero-art .r1{transform:skewX(8deg) rotate(4deg)}
@media (min-width:820px){html[dir="ltr"] .drawer{inset:0 0 0 auto;border-radius:22px 0 0 22px;transform:translateX(100%);padding-left:0;padding-right:env(safe-area-inset-right,0px)}html[dir="ltr"] .drawer.show{transform:none}}
.foot{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px}
.linkbtn:hover{color:var(--green)}
#login{padding-block:48px 80px;display:grid;place-items:center}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 24px;box-shadow:var(--shadow);animation:pop .5s cubic-bezier(.3,1.4,.5,1)}
.login-card .lock{width:58px;height:58px;border-radius:18px;background:var(--brown);color:var(--brown-ink);display:grid;place-items:center;margin-bottom:12px}
.login-card h1{font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--green);margin-bottom:2px}
.login-card p{color:var(--muted);margin:0 0 16px;font-size:14px}
.pw{position:relative}
.pw button{position:absolute;inset-inline-end:6px;top:50%;translate:0 -50%;border:0;background:none;color:var(--muted);font-size:12.5px;padding:6px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>

function fly(from){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const a=from.getBoundingClientRect(),wasHidden=$("#cartbar").classList.contains("hide"),c=$("#cartCount").getBoundingClientRect();

let actx=null;
$("#soundBtn").onclick=async()=>{
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();await actx.resume()}catch{}
  try{if("Notification" in window&&Notification.permission==="default")await Notification.requestPermission()}catch{}
  S.alerts=true;$("#soundBtn").textContent=t("notifIsOn");$("#soundBtn").classList.add("on");chime();

function chime(){
  if(!S.alerts||!actx)return;const c=actx.currentTime;
  [[880,0],[1175,.16],[1568,.32]].forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,c+d);g.gain.linearRampToValueAtTime(.35,c+d+.02);g.gain.exponentialRampToValueAtTime(.001,c+d+.45);o.connect(g).connect(actx.destination);o.start(c+d);o.stop(c+d+.5)});
}
function toast(title,msg,cls){
  const el=document.createElement("div");el.className="toast "+(cls||"");el.innerHTML=`<b>${esc(title)}</b>${esc(msg)}`;
  $("#toasts").appendChild(el);setTimeout(()=>{el.style.transition="opacity .4s";el.style.opacity="0";setTimeout(()=>el.remove(),400)},cls==="new"?9000:3500);
}

  if(S.view!=="owner"||document.hidden)bumpUnread(S.unread+1);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.view==="owner")bumpUnread(0)});

/* ---------- views + login ---------- */
function showView(v){
  if(v==="owner"&&!S.authed)v="login";
  S.view=v;
  $("#customer").hidden=v!=="menu";$("#login").hidden=v!=="login";$("#owner").hidden=v!=="owner";
  $("#viewSwitch").hidden=!S.authed;
  $("#vMenu").setAttribute("aria-pressed",v!=="owner");$("#vOwner").setAttribute("aria-pressed",v==="owner");
  if(v==="owner"){bumpUnread(0);startOrders();renderOwner()}
  if(v==="login"){$("#lErr").hidden=true;setTimeout(()=>$("#lUser").focus(),50)}
  paintSetup();updateCartBar();scrollTo({top:0});
  try{history.replaceState(null,"",v==="menu"?location.pathname:"#owner")}catch{}
}
$("#vMenu").onclick=()=>showView("menu");
$("#vOwner").onclick=()=>showView("owner");
$("#ownerLink").onclick=()=>showView("owner");
$("#lBack").onclick=()=>showView("menu");
$("#showPw").onclick=()=>{const p=$("#lPass");p.type=p.type==="password"?"text":"password";$("#showPw").textContent=p.type==="password"?t("show"):t("hide")};
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=$("#lErr"),card=$("#loginForm"),btn=card.querySelector('[type=submit]');
  const fail=msg=>{err.textContent=msg;err.hidden=false;card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake")};
  if(!auth){fail(t("setupMissing"));return}
  if($("#lUser").value.trim().toLowerCase()!==OWNER_USER){fail(t("badLogin"));return}
  btn.disabled=true;btn.textContent=t("loggingIn");
  try{await auth.signInWithEmailAndPassword(OWNER_EMAIL,$("#lPass").value);$("#lPass").value=""}
  catch(e2){fail(e2&&e2.code==="auth/network-request-failed"?t("netLogin"):t("badLogin"))}
  btn.disabled=false;btn.textContent=t("signIn");
});
$("#logoutBtn").onclick=async()=>{try{await auth.signOut()}catch{}};

/* owner settings */
$("#openToggle").onchange=async e=>{const open=e.target.checked;$("#openLabel").textContent=open?t("openOn"):t("openOff");try{await fs.doc("shop/settings").set({open},{merge:true})}catch{toast(t("notSaved"),t("tryAgain"))}};
$("#saveInsta").onclick=async()=>{const v=$("#instaInput").value.trim().slice(0,80);try{await fs.doc("shop/settings").set({instapay:v},{merge:true});toast(t("saved"),t("savedInsta"))}catch{toast(t("notSaved"),t("tryAgain"))}};

function startOrders(){
  if(S.ordersSub||!fs||!S.authed)return;
  S.ordersSub=fs.collection("orders").orderBy("createdAt","desc").limit(300).onSnapshot(snap=>{
    const all=snap.docs.map(d=>({...d.data(),id:d.id}));
    if(S.seen===null)S.seen=new Set(all.map(o=>o.id));
    else all.forEach(o=>{if(!S.seen.has(o.id)){S.seen.add(o.id);if(o.status==="new")notifyNew(o)}});
    S.all=all;if(S.view==="owner")renderOwner();
    $("#liveState").innerHTML=`<i></i><span>${t("live")}</span>`;
  },e=>{console.error(e);$("#liveState").textContent=t("offline")});
}
function stopOrders(){if(S.ordersSub){S.ordersSub();S.ordersSub=null}S.seen=null;S.all=[]}
function paintSetup(){const el=$("#accessNote");el.textContent=t("setupMissing");el.hidden=!!fs||S.view!=="owner"&&S.view!=="login"}

/* ---------- boot ---------- */
applyLang();
if(fs){
  fs.doc("shop/settings").onSnapshot(s=>{
    const d=s.exists?s.data():{};S.shop={open:d.open!==false,instapay:d.instapay||""};
    $("#closedNote").hidden=S.shop.open;$("#openToggle").checked=S.shop.open;$("#openLabel").textContent=S.shop.open?t("openOn"):t("openOff");
    if(document.activeElement!==$("#instaInput"))$("#instaInput").value=S.shop.instapay;
    if(!$("#drawer").hidden&&S.step==="details")renderDrawer();
  },()=>{});
  S.myIds.forEach(watchMine);
  auth.onAuthStateChanged(u=>{
    const was=S.authed;S.authed=!!(u&&u.email&&u.email.toLowerCase()===OWNER_EMAIL.toLowerCase());
    if(S.authed){startOrders();if(S.view!=="menu"||location.hash==="#owner")showView("owner");else $("#viewSwitch").hidden=false}
    else{stopOrders();if(was||S.view==="owner")showView("menu");$("#viewSwitch").hidden=true}
  });
}
if(location.hash==="#owner")showView("owner");
</script>
</body>
</html>
